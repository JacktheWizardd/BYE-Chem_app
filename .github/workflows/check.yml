name: check

# Runs `npm run check` (map up to date, types, lint, tests) with the two engines
# checked out beside the app, the same layout as on a developer's machine.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BYE-Chem_app
      - uses: actions/checkout@v4
        with:
          repository: JacktheWizardd/BYE-Chem_engine
          path: BYE-Chem_engine
      - uses: actions/checkout@v4
        with:
          repository: JacktheWizardd/BYE-Math_engine
          path: BYE-Math_engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            BYE-Chem_app/package-lock.json
            BYE-Chem_engine/package-lock.json
            BYE-Math_engine/package-lock.json
      # The engines are linked as TypeScript source, so they need their own packages installed too
      # (exactly as on a developer's machine); Metro still bundles one React, from the app.
      - run: npm ci
        working-directory: BYE-Math_engine
      - run: npm ci
        working-directory: BYE-Chem_engine
      - run: npm ci
        working-directory: BYE-Chem_app
      - run: npm run check
        working-directory: BYE-Chem_app
        env:
          CI: '1'
